# The VPS (ADR-0030): Caddy (TLS, the console, a reverse proxy) in front of
# the server. Video and MAVLink never pass through either: WebRTC goes
# between the browser and the drone. TURN (coturn) is on hold (ADR-0015).
#
#   cp .env.example .env    # set DOMAIN, ADMIN_USERNAME, ADMIN_PASSWORD
#   (cd ../web && npm run build:server)
#   docker compose up -d --build
#
# See README.md here for registering drones and day-to-day admin.
services:
  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
    volumes:
      - server-data:/data
    expose:
      - "8788"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - server
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web/dist-server:/srv:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  server-data:
  caddy-data:
  caddy-config:
